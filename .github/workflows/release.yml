name: Release

# Every merge to main that carries a feat/fix/perf/breaking commit becomes a
# tag, so a consumer ticket unblocked by a library merge always has a version
# to install. See scripts/release.mjs.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@borjarafols-dev'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
